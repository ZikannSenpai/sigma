        <script>
            window.addEventListener("load", () => {
                document.body.classList.add("loaded");
            });

            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add("show");
                    }
                });
            });

            document.querySelectorAll(".fade").forEach(el => {
                observer.observe(el);
            });
        </script>
